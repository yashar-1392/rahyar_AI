<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوش مصنوعی رهیار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%); color: #e2e8f0; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .ai-bold-text { font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.08); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.15); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* استایل اختصاصی جداول */
        .ai-table-container { width: 100%; overflow-x: auto; margin: 12px 0; border-radius: 12px; border: 1px solid #1e293b; }
        .ai-table { width: 100%; border-collapse: collapse; text-align: right; font-size: 11px; background: #0b0f19; }
        .ai-table th { background: #1e293b; color: #38bdf8; padding: 10px; font-weight: 700; border-bottom: 2px solid #334155; }
        .ai-table td { padding: 10px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
        .ai-table tr:hover { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- هدر اصلی -->

            <div class="bg-gradient-to-tr from-indigo-600 to-sky-500 p-1.5 rounded-xl flex items-center justify-center">

            </div>
            <div>

        </div>

            <div class="text-center space-y-2 mb-4">

            <!-- لیست خدمات فعال -->

                <button onclick="switchService('text-tools')" class="glass-card p-3 rounded-xl flex items-center gap-3 hover:border-amber-500/40 hover:bg-slate-800/50 transition-all text-right">

                    <div class="flex-1">
                        <h3 class="font-bold text-xs text-white">🔧 ابزارهای هوشمند متن</h3>

                    </div>
                </button>

                <button onclick="switchService('coding')" class="glass-card p-3 rounded-xl flex items-center gap-3 hover:border-sky-400/40 hover:bg-slate-800/50 transition-all text-right">

                    <div class="flex-1">

                    </div>
                </button>

                <button onclick="switchService('channel')" class="glass-card p-3 rounded-xl flex items-center gap-3 hover:border-purple-500/40 hover:bg-slate-800/50 transition-all text-right">

                    <div class="flex-1">

                <button onclick="switchService('study')" class="glass-card p-3 rounded-xl flex items-center gap-3 hover:border-violet-500/40 hover:bg-slate-800/50 transition-all text-right">
                    <div class="p-2.5 bg-violet-500/10 rounded-lg text-violet-400"><i class="fas fa-book"></i></div>

                <button onclick="alert('به زودی...')" class="glass-card p-3 rounded-xl flex items-center gap-3 opacity-40 text-right cursor-not-allowed">
                    <div class="p-2.5 bg-slate-700/20 rounded-lg text-slate-500"><i class="fas fa-image"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-xs text-slate-400">ساخت تصویر (به زودی...)</h3></div>
                </button>

                <button onclick="alert('به زودی...')" class="glass-card p-3 rounded-xl flex items-center gap-3 opacity-40 text-right cursor-not-allowed">
                    <div class="p-2.5 bg-slate-700/20 rounded-lg text-slate-500"><i class="fas fa-volume-high"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-xs text-slate-400">متن به صوت (به زودی...)</h3></div>
                </button>

                <button onclick="alert('به زودی...')" class="glass-card p-3 rounded-xl flex items-center gap-3 opacity-40 text-right cursor-not-allowed">
                    <div class="p-2.5 bg-slate-700/20 rounded-lg text-slate-500"><i class="fas fa-video"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-xs text-slate-400">ساخت ویدئو (به زودی...)</h3></div>
                </button>

                <button onclick="alert('به زودی...')" class="glass-card p-3 rounded-xl flex items-center gap-3 opacity-40 text-right cursor-not-allowed">
                    <div class="p-2.5 bg-slate-700/20 rounded-lg text-slate-500"><i class="fas fa-microphone"></i></div>
                    <div class="flex-1"><h3 class="font-bold text-xs text-slate-400">مکالمه صوتی با رهیار (به زودی...)</h3></div>
                </button>
            </div>
        </div>

        <!-- رابط کاربری فرستادن پیام و خروجی ابزارها -->
        <div id="chat-interface" class="hidden flex-1 flex flex-col space-y-3 h-full min-h-0 w-full">
            
            <!-- باکس تنظیمات اختصاصی بخش چت (شخصیت‌ها) -->
            <div id="chat-config-box" class="glass-card p-3 rounded-2xl hidden space-y-2">
                <div>
                    <span class="text-[11px] text-slate-400 block mb-1.5"><i class="fas fa-user-gear text-indigo-400 ml-0.5"></i> شخصیت چت رهیار:</span>
                    <div class="flex flex-wrap gap-1">
                        <button onclick="setPersona('normal', event)" class="persona-btn bg-indigo-600 text-white text-[10px] px-2.5 py-1 rounded-lg transition-all">🤖 عادی</button>
                        <button onclick="setPersona('pessimistic', event)" class="persona-btn bg-slate-800 text-slate-300 text-[10px] px-2.5 py-1 rounded-lg transition-all hover:bg-slate-700">🤨 بدبین</button>
                        <button onclick="setPersona('funny', event)" class="persona-btn bg-slate-800 text-slate-300 text-[10px] px-2.5 py-1 rounded-lg transition-all hover:bg-slate-700">😂 شوخ‌طبع</button>
                        <button onclick="setPersona('playful', event)" class="persona-btn bg-slate-800 text-slate-300 text-[10px] px-2.5 py-1 rounded-lg transition-all hover:bg-slate-700">😜 بازیگوش</button>
                        <button onclick="setPersona('detective', event)" class="persona-btn bg-slate-800 text-slate-300 text-[10px] px-2.5 py-1 rounded-lg transition-all hover:bg-slate-700">🧐 کاراگاه</button>
                        <button onclick="setPersona('professional', event)" class="persona-btn bg-slate-800 text-slate-300 text-[10px] px-2.5 py-1 rounded-lg transition-all hover:bg-slate-700">🤓 حرفه‌ای</button>
                        <button onclick="setPersona('emotionless', event)" class="persona-btn bg-slate-800 text-slate-300 text-[10px] px-2.5 py-1 rounded-lg transition-all hover:bg-slate-700">😶 بی احساس</button>
                    </div>
                </div>
            </div>

            <!-- منوی فرعی برای ابزارها و پرامپت‌ها -->
            <div id="sub-menu-container" class="glass-card p-3 rounded-2xl hidden">
                <span class="text-[11px] text-slate-400 block mb-1.5" id="sub-menu-title">گزینه‌ها:</span>
                <div class="flex flex-wrap gap-1" id="sub-menu-options"></div>
            </div>

            <!-- فرم اطلاعات کانال هوشمند شبکه‌های اجتماعی -->
            <div id="channel-form-container" class="glass-card p-3 rounded-2xl hidden space-y-2 text-[11px]">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="text-slate-400 block mb-0.5">🎭 تعریف چگونگی رهیار برای کانال:</label>
                        <input type="text" id="chan-style" placeholder="مثال: نویسنده محتوای تکنولوژی با لحن شاد..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-0.5">📌 موضوع کانال:</label>
                        <input type="text" id="chan-topic" placeholder="مثال: تکنولوژی | سلامت و تغذیه | کسب‌وکار | طراحی" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-white focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="text-slate-400 block mb-0.5">😀 ایموجی باشه؟</label>
                        <select id="chan-emoji" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-white focus:outline-none">
                            <option value="بله، از ایموجی‌های مناسب استفاده کن.">بله</option>
                            <option value="خیر، بدون ایموجی بنویس.">خیر</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-0.5">📏 طول پیام چقدر باشه؟</label>
                        <input type="text" id="chan-length" placeholder="مثال: کوتاه، متوسط، مفصل" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-white focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- باکس چت و نمایش پیام‌ها -->
            <div id="chat-box" class="flex-1 bg-slate-950/80 border border-slate-800 rounded-2xl p-4 overflow-y-auto custom-scrollbar space-y-3 shadow-inner flex flex-col text-xs">
                <div id="system-welcome" class="bg-indigo-950/30 border border-indigo-900/40 p-3 rounded-xl text-slate-300 leading-relaxed flex items-start gap-2">
                    <div id="welcome-icon-container" class="text-indigo-400 mt-0.5"><i class="fas fa-lightbulb"></i></div>
                    <div id="tool-instruction">سیستم فعال است؛ درخواست خود را بنویسید!</div>
                </div>
            </div>
        </div>
    </main>

    <!-- فوتر ثابت ابزار -->
    <footer class="glass-card border-t border-slate-800/80 p-3 w-full z-10">
        <div class="max-w-4xl mx-auto space-y-3">
            <div id="input-container" class="hidden flex gap-2">
                <textarea id="user-input" rows="1" placeholder="درخواستت رو اینجا برام بنویس..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500 shadow-inner resize-none custom-scrollbar leading-relaxed" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="send-btn" class="bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-500 hover:to-sky-500 text-white px-5 rounded-xl transition-all flex items-center justify-center self-end h-[38px]">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-1 text-[10px] text-slate-400 border-b border-slate-800/50 pb-2">
                <span onclick="showFooterInfo('invite')" class="cursor-pointer hover:text-indigo-400 transition-colors"><i class="fas fa-user-plus ml-0.5"></i> 🔗 دعوت از دوستان</span>
                <span onclick="showFooterInfo('guide')" class="cursor-pointer hover:text-indigo-400 transition-colors"><i class="fas fa-book-open ml-0.5"></i> 📖 راهنما</span>
                <span onclick="showFooterInfo('about')" class="cursor-pointer hover:text-indigo-400 transition-colors"><i class="fas fa-info-circle ml-0.5"></i> ℹ️ درباره</span>

            </div>

            <div class="text-center text-[9px] text-slate-500" id="current-status">وضعیت: آماده به کار</div>
        </div>
    </footer>

    <script>
        let currentService = "menu";
        let activeSubTemplate = null;
        let selectedPersona = "normal";

        const adsList = [
            { text: "🔸 ۱۰٪ تخفیف خرید اول کیمدی از فروشگاه اینترنتی یاشار", btnText: "خرید", url: "https://yashar-store.mydigify.app" },
            { text: "🔸 یک خرید رایگان تا سقف ۹۹ هزار تومن از یاشار دیزاین", btnText: "خرید", url: "https://yashar-1392.github.io/yashar-design/" },
            { text: "🔸 در کانال رهیار در بله عضو شوید", btnText: "عضویت", url: "http://ble.ir/rahyar_ai" },
            { text: "🔸 دلت کارت های کیمدی با تخفیف و قیمت مناسب میخواد؟ بیا فروشگاه اینترنتی یاشار", btnText: "خرید", url: "https://yashar-store.mydigify.app" },

        const personas = {
            normal: "تو یک دستیار هوشمند، همه فن حریف و راهنمای عالی به نام رهیار هستی. لحن صمیمی و محترمانه داشته باش. کلمات مهم را بین ** قرار بده تا پررنگ شوند.",

        // مبدل مارک‌داون پیشرفته جهت پوشش جدول‌ها، قطعه کدها، بولدها و خطوط جدید
        function formatMarkdown(text) {
            let formatted = text;

            // ۱. پردازش و ساخت جداول منطقی
            const tableRegex = /\|(.+)\|[\r\n]+\|([-:\s|]+)\|[\r\n]+((?:\|.+|[\r\n]*)+)/g;
            formatted = formatted.replace(tableRegex, function(match, header, separator, rows) {
                const headers = header.split('|').map(h => h.trim()).filter(h => h);
                const tableRows = rows.trim().split('\n').map(row => {
                    return row.split('|').map(r => r.trim()).filter(r => r || r === "");
                }).filter(row => row.length > 0);

                let htmlTable = '<div class="ai-table-container"><table class="ai-table"><thead><tr>';
                headers.forEach(h => htmlTable += `<th>${h}</th>`);
                htmlTable += '</tr></thead><tbody>';

                tableRows.forEach(row => {
                    htmlTable += '<tr>';
                    row.forEach(cell => htmlTable += `<td>${cell}</td>`);
                    htmlTable += '</tr>';
                });

                htmlTable += '</tbody></table></div>';
                return htmlTable;
            });

            // ۲. قالب‌بندی بلاک‌های برنامه‌نویسی و افزودن دکمه کپی ایمن بدون تداخل بصری
            if (formatted.includes("```")) {
                const parts = formatted.split("```");
                for (let i = 1; i < parts.length; i += 2) {
                    const lines = parts[i].split("\n");
                    const language = lines[0].trim();
                    const rawCode = lines.slice(1).join("\n").trim();
                    
                    const escapedCode = rawCode
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");

                    parts[i] = `
                        <div class="my-3 rounded-lg border border-slate-800 bg-[#020617] overflow-hidden">
                            <div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 border-b border-slate-800 text-[10px] text-slate-400">
                                <span>${language || 'Code'}</span>
                                <button onclick="copyCodeText(this)" data-code="${encodeURIComponent(rawCode)}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition-all">کپی کد</button>
                            </div>
                            <pre class="p-3 text-[11px] overflow-x-auto text-left" style="direction: ltr; font-family: monospace; color: #38bdf8;"><code>${escapedCode}</code></pre>
                        </div>
                    `;
                }
                formatted = parts.join("");
            }

            // ۳. بولد کردن عبارات محصور در بین **
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong class="ai-bold-text">$1</strong>');

            // ۴. حفظ خطوط جدید با استفاده از متد تعویض به تگ شکست خط
            formatted = formatted.replace(/\n/g, '<br>');

            return formatted;
        }

        function copyCodeText(btn) {
            const code = decodeURIComponent(btn.getAttribute('data-code'));
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "کپی شد!";
                btn.classList.add("bg-emerald-600");
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove("bg-emerald-600");
                }, 2000);
            }).catch(err => {
                alert("امکان کپی خودکار فراهم نشد.");
            });
        }

        function setupSubMenu(title, options) {
